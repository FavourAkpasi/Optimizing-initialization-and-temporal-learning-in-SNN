[project]
name = "edgesnn"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgesnn"]
